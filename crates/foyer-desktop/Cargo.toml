[package]
name = "foyer-desktop"
description = "Foyer desktop client (GPUI): browse, install and update games."
version = "0.1.0"
edition.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "foyer-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
chrono.workspace = true
foyer-install.workspace = true
foyer-types.workspace = true
gpui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# gpui 0.2 pulls in xattr 0.2, which uses `libc::ENOATTR` on Linux. libc
# 0.2.189 dropped that constant, so cap libc until gpui moves to xattr 1.x.
libc = "<0.2.189"

# `cargo deb -p foyer-desktop` (see .github/workflows/desktop-release.yml).
# The .deb doesn't update itself; the client points to foyer.lol/app.
[package.metadata.deb]
name = "foyer"
maintainer = "Foyer <noreply@foyer.lol>"
copyright = "Foyer"
extended-description = "Browse, install and update hand-picked indie games from foyer.lol. No account needed."
section = "games"
priority = "optional"
# GPUI loads Vulkan, Wayland and fontconfig at runtime, so dpkg-shlibdeps
# can't see them.
depends = "$auto, libvulkan1, libwayland-client0, libfontconfig1"
recommends = "mesa-vulkan-drivers | vulkan-icd"
assets = [
  ["target/release/foyer-desktop", "usr/bin/", "755"],
  ["packaging/linux/lol.foyer.Foyer.desktop", "usr/share/applications/", "644"],
  ["packaging/icon-512.png", "usr/share/icons/hicolor/512x512/apps/lol.foyer.Foyer.png", "644"],
]

# The Windows icon and version info are compiled into the .exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
