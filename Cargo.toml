[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/foyer-install",
  "crates/foyer-api",
  "crates/foyer-cli",
  "crates/foyer-patch",
  "crates/foyer-types",
  "crates/foyer-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/TorstenDittmann/foyer"
rust-version = "1.89"

[workspace.dependencies]
# internal
foyer-install = { path = "crates/foyer-install" }
foyer-patch = { path = "crates/foyer-patch" }
foyer-types = { path = "crates/foyer-types" }

# async + web
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
libsql = "0.10"

# web
console_error_panic_hook = "0.1"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"

# desktop
gpui = "0.2"

# api
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "ring",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "webpki-roots",
] }
argon2 = { version = "0.5", features = ["std"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.8"
sha2 = "0.10"
# Passkeys. State serialisation lets a ceremony started on one API replica
# finish on another (the state is kept in the database, never sent to clients).
webauthn-rs = { version = "0.6", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.6"
url = "2"
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-axum = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }

# common
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.3"
minisign-verify = "0.2"
semver = "1"
blake3 = "1"
fastcdc = "5"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Used by cargo-leptos for the browser (WebAssembly) build of foyer-web.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
