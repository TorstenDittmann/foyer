[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/foyer-api",
  "crates/foyer-cli",
  "crates/foyer-patch",
  "crates/foyer-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/TorstenDittmann/foyer"
rust-version = "1.88"

[workspace.dependencies]
# internal
foyer-patch = { path = "crates/foyer-patch" }

# async + web
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
libsql = "0.10"

# web
console_error_panic_hook = "0.1"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"

# desktop
gpui = "0.2"

# common
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Used by cargo-leptos for the browser (WebAssembly) build of foyer-web.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
