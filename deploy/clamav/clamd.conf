# clamd for the Foyer worker. Runs in the foreground as the clamav user.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /run/clamav/clamd.pid

# No LogFile: in the foreground clamd logs to stderr, which orch collects.
LogTime yes
LogVerbose no
ExtendedDetectionInfo yes

# Game builds hold large files. clamd skips (and reports clean) anything over
# these limits, so raise them close to the 4 GB maximum.
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxThreads 4
ReadTimeout 300
CommandReadTimeout 30

# Reload signatures in place instead of loading a second copy next to the
# first; this keeps memory near 1.5 GB at the cost of a short pause.
ConcurrentDatabaseReload no
SelfCheck 3600
